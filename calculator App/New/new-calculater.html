<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator App</title>
<style>
    body {
        background: #f4f4f4;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .calculator {
        background: #222;
        padding: 30px 20px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        width: 320px;
    }
    .display {
        background: #111;
        color: white;
        font-size: 2.2em;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        text-align: right;
        overflow-x: auto;
        min-height: 50px;
    }
    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }
    button {
        padding: 18px 0;
        font-size: 1.2em;
        border: none;
        border-radius: 8px;
        background: #333;
        color: #fff;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
    }
    button:hover {
        background: #444;
    }
    button:active {
        transform: scale(0.95);
    }
    .operator {
        background: #ff9500;
    }
    .operator:hover {
        background: #e58900;
    }
    .equal {
        background: #34c759;
        grid-column: span 2;
    }
    .equal:hover {
        background: #28a745;
    }
    .clear {
        background: #ff3b30;
    }
    .clear:hover {
        background: #d92a20;
    }
</style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear" type="button" name="btn" value="C">C</button>
            <button type="button" name="btn" value="(">(</button>
            <button type="button" name="btn" value=")">)</button>
            <button class="operator" type="button" name="btn" value="/">÷</button>
            <button type="button" name="btn" value="7">7</button>
            <button type="button" name="btn" value="8">8</button>
            <button type="button" name="btn" value="9">9</button>
            <button class="operator" type="button" name="btn" value="*">×</button>
            <button type="button" name="btn" value="4">4</button>
            <button type="button" name="btn" value="5">5</button>
            <button type="button" name="btn" value="6">6</button>
            <button class="operator" type="button" name="btn" value="-">−</button>
            <button type="button" name="btn" value="1">1</button>
            <button type="button" name="btn" value="2">2</button>
            <button type="button" name="btn" value="3">3</button>
            <button class="clear" type="button" name="btn" value="CE">CE</button>
            <button class="operator" type="button" name="btn" value="+">+</button>
            <button type="button" name="btn" value="0">0</button>
            <button type="button" name="btn" value=".">.</button>
            <button class="equal" type="button" name="btn" value="=">=</button>
        </div>
    </div>
    <script src="new-calculator.js"></script>
</body>
</html>
