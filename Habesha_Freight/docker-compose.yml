services:
  # 1. PostgreSQL with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: habesha_freight_db
    restart: always
    environment:
      POSTGRES_DB: habesha_freight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habesha_freight"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habesha_freight_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: habesha_freight
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: supersecret_habesha_freight_jwt_key_2026
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Nginx Static Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: habesha_freight_frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
