version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: habeshafreight_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habeshafreight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habeshafreight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - habeshafreight_network

  redis:
    image: redis:7-alpine
    container_name: habeshafreight_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - habeshafreight_network

  app:
    build: .
    container_name: habeshafreight_app
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: habeshafreight
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_here
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - habeshafreight_network

volumes:
  postgres_data:
  redis_data:

networks:
  habeshafreight_network:
    driver: bridge